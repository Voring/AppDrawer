name: Restore CI workflow

# 一次性工作流：把 .github/workflows/build.yml 整份还原到出包正常的那个提交（6cab28f）。
# 只动这一个文件，不碰源码。执行后即删除。

on:
  push:
    paths:
      - '.github/workflows/restore-ci.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Restore build.yml
        run: |
          set -euo pipefail
          git checkout 6cab28f753cf9d80db5ef6b2f8924f5348669403 -- .github/workflows/build.yml
          grep -n 'THEOS_PACKAGE_SCHEME=roothide' .github/workflows/build.yml
          grep -c '' .github/workflows/build.yml
          git status --short

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "Voring"
          git config user.email "64722054+Voring@users.noreply.github.com"
          git add -A
          git commit -m "修复 CI：build.yml 整份还原到出包正常的版本"
          git push origin HEAD:main
