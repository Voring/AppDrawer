name: Revert to 1.4.2

# 一次性工作流：由 CI 自己把 Core/ 与 Shared/ 整份还原到 1.4.2 验收版提交，
# 避免人工逐文件覆盖出错。触发条件只绑定本文件路径，执行一次后即删除。

on:
  push:
    paths:
      - '.github/workflows/revert-142.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  revert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Restore 1.4.2 sources
        run: |
          set -euo pipefail
          git checkout fc1677c4498a14f1caadeb5f94e59ce0d9740df4 -- Core Shared
          sed -i 's/^Version: .*/Version: 1.4.6/' control
          sed -i 's/^export PACKAGE_VERSION := .*/export PACKAGE_VERSION := 1.4.6/' Makefile
          grep -n '^Version:' control
          grep -n 'PACKAGE_VERSION' Makefile
          git status --short

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "Voring"
          git config user.email "64722054+Voring@users.noreply.github.com"
          git add -A
          git commit -m "1.4.6：全面回退到 1.4.2 源码（撤销全部精简改动），不做任何代码精简"
          git push origin HEAD:main
