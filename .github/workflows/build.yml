name: Build AppDrawer

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: brew install ldid xz make

      - name: Setup Theos (roothide)
        run: |
          set -euo pipefail
          git clone --recursive --depth 1 https://github.com/roothide/theos.git "$HOME/theos"

      - name: Install iOS 16.5 SDK
        run: |
          set -euo pipefail
          git clone --filter=blob:none --sparse --depth 1 https://github.com/theos/sdks.git /tmp/sdks
          cd /tmp/sdks
          git sparse-checkout set iPhoneOS16.5.sdk
          rm -rf "$HOME/theos/sdks"
          mv /tmp/sdks "$HOME/theos/sdks"
          ls "$HOME/theos/sdks"

      - name: Sanity check sources
        run: |
          set -euo pipefail
          grep -m1 '^Version:' control
          grep -q 'dispatch_semaphore_wait' Core/ADAppInfo.m
          grep -q 'canOpenURL' Core/ADURLDispatchHooks.m
          if grep -q 'LSApplicationWorkspace' Core/ADURLDispatchHooks.m; then
            echo '多余的 LS 钩子又回来了'; exit 1
          fi
          test ! -d Handler
          echo '源码标记齐全'

      - name: Build roothide package
        run: |
          set -o pipefail
          export THEOS="$HOME/theos"
          make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide ARCHS=arm64e \
            TARGET=iphone:clang:16.5:16.0 2>&1 | tee /tmp/build.log
          exit "${PIPESTATUS[0]}"

      - name: Diagnostics
        if: always()
        run: |
          ls -l packages 2>&1 || true
          if [ ! -f /tmp/build.log ] || ! ls packages/*.deb >/dev/null 2>&1; then
            echo '=== BUILD FAILED, tail of log ==='
            tail -n 60 /tmp/build.log 2>/dev/null || true
          fi

      - name: Upload deb artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AppDrawer-roothide
          path: packages/*.deb
          if-no-files-found: error

      - name: Read package version
        if: success()
        run: |
          set -euo pipefail
          VERSION="$(grep -m1 '^Version:' control | awk '{print $2}')"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          ls -l packages/*.deb

      - name: Release deb
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: AppDrawer ${{ env.VERSION }} roothide build ${{ github.run_number }}
          body: |
            **${{ env.VERSION }}** — UI = 1.5.0 原样，叠加：安全模式修复 + URL scheme 纯钩子。

            1. **图标崩溃修复**：`iconpreload` 后台队列调用 `+[UIImage _applicationIconImageForBundleIdentifier:format:scale:]`，该接口内部在 `dispatch_once` 里读 `+[UIScreen mainScreen]`（有主线程断言）→ 抛异常 → abort，SpringBoard 连崩 3 次进安全模式。现改为该接口一律回主线程执行（带 3 秒超时，不拖死 SpringBoard），并保留启动时缓存屏幕倍数。
            2. **URL scheme 纯钩子**：无中转 App、不注册 scheme；钩子 = Kayoko 那 7 个（6 SpringBoard + FBSystemService）+ `UIApplication canOpenURL:`。1.7.2 起删掉了多余的 2 个 `LSApplicationWorkspace` 钩子。

            **未动**：面板布局（控制区在下方、App 从下往上、向上滑动关闭）、高度 200、宽度 430 封顶、下移量公式、键盘唤出、场景选取、检索。

            deb: `com.voring.appdrawer_${{ env.VERSION }}_iphoneos-arm64e.deb`
          files: packages/*.deb
          fail_on_unmatched_files: false
