name: Build AppDrawer

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install build dependencies
        run: brew install ldid xz make

      - name: Setup Theos (roothide)
        run: |
          set -euo pipefail
          git clone --recursive --depth 1 https://github.com/roothide/theos.git "$HOME/theos"

      - name: Install iOS 16.5 SDK
        run: |
          set -euo pipefail
          git clone --filter=blob:none --sparse --depth 1 https://github.com/theos/sdks.git /tmp/sdks
          cd /tmp/sdks
          git sparse-checkout set iPhoneOS16.5.sdk
          rm -rf "$HOME/theos/sdks"
          mv /tmp/sdks "$HOME/theos/sdks"
          ls "$HOME/theos/sdks"

      # Git 不保留可执行位时 dm.pl 会报 “bad permissions 644”，这里强制修正。
      - name: Fix maintainer script permissions
        run: |
          chmod 755 layout/DEBIAN/postinst layout/DEBIAN/postrm
          ls -l layout/DEBIAN

      - name: Build roothide package
        run: |
          set -o pipefail
          export THEOS="$HOME/theos"
          make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide ARCHS=arm64e \
            TARGET=iphone:clang:16.5:16.0 2>&1 | tee /tmp/build.log
          exit "${PIPESTATUS[0]}"

      - name: Diagnostics
        if: always()
        run: |
          pwd
          echo '--- packages ---'
          ls -l packages 2>&1 || true

      - name: Publish deb and build log
        if: always()
        continue-on-error: true
        run: |
          mkdir -p out
          if ls packages/*.deb >/dev/null 2>&1; then
            cp packages/*.deb out/latest.deb
          fi
          {
            echo "=== BUILD LOG (last 300 lines) ==="
            tail -n 300 /tmp/build.log 2>/dev/null || echo "no log produced"
          } | sed 's/[[:cntrl:]]//g' > build-log.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B main
          git add build-log.txt out/latest.deb 2>/dev/null || git add build-log.txt || true
          git commit -m "ci: build log and deb [skip ci]" || true
          git pull --rebase origin main || true
          git push -u origin main || true

      - name: Upload deb artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AppDrawer-roothide
          path: packages/*.deb
          if-no-files-found: error

      - name: Read package version
        if: success()
        run: |
          set -euo pipefail
          VERSION="$(grep -m1 '^Version:' control | awk '{print $2}')"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "package version = ${VERSION}"

      - name: Release deb
        if: success()
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: AppDrawer ${{ env.VERSION }} roothide build ${{ github.run_number }}
          body: |
            ## AppDrawer ${{ env.VERSION }} / build ${{ github.run_number }}

            ### 高度
            - 面板高度固定为 **200**：竖屏单行显示即完美，与横屏完全一致。
            - 1.4.0 起高度固定 200；上一版（1.3.x）高度为 390，竖屏双行显示完美。
            - 未新增任何横竖屏判定分支；仍只有一套竖屏布局参数，横屏即该布局的自然拉伸/几何压缩。

            ### 宽度
            - 竖屏：满宽，左右各留 8pt 边距（side inset），水平居中。
            - 横屏：同样取满宽后**封顶 430**（`kADPanelMaxWidth = 430`），水平居中，避免横屏面板过宽。

            ### 横屏键盘避让
            - 不判断方向，唯一约束是「面板底边不得越过键盘顶边」：`maxBottom = min(screenBottom, keyboardTop - 8)`。
            - 键盘顶边来自 `UIKeyboardWillChangeFrameNotification`，换算到面板所在视图坐标系；键盘隐藏时置 0。
            - 面板高度 = min(目标高度, maxBottom - topLimit)，并保底 `kADPanelKeyboardMinHeight = 120`，避免键盘很高时把面板压到看不见。
            - 因此横屏键盘更高时，面板会被同一条规则自然地往上推、同时压矮；这是几何结果，不是方向分支。

            ### 检索（1.4.1）
            - **只匹配应用名称与拼音**，检索键只含 名称 / 全拼 / 首字母 / 去空格全拼 四段，**包名不参与**。
            - 四段以换行分隔、各自独立规范化，段与段之间绝不拼接。
            - 查询唯一的预处理是删掉所有空白（中文输入法未上屏时会把拼音拆成 `wei xin`），得到一个连贯串；该串必须**完整出现在某一个字段内**才算命中，不拆词、不跨字段。
            - 由此修正 `qq` 误命中：旧版把多段空格拼成一条串后整体删空格，字段边界消失——轻松签的首字母 `qsq` 尾 `q` 接 `qingsongqian` 首 `q` 拼成 `qq`，`Qing` 的首字母单 `q` 前后都是 `q` 也拼成 `qq`。现在 `qq` 只命中 QQ 本身。
            - 自测：`qq` → 仅 QQ；`wei` / `wei xin` / `weixin` → 微信；`wx` → 微信；`zhi fu` / `zhifubao` → 支付宝。

            ### 其他
            - 中文拼音未上屏即实时检索：marked text + 全文档 `textInRange` + KVC 兜底，配合 0.15s 轮询。
            - 抓杆保持胶囊圆头（`kCGLineCapRound`）。

            deb: `com.voring.appdrawer_${{ env.VERSION }}_iphoneos-arm64e.deb`
          files: packages/*.deb
          fail_on_unmatched_files: false
