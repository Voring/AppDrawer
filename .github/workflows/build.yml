name: Build AppDrawer

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          set -euo pipefail
          brew install ldid xz dpkg || true

      - name: Setup Theos (roothide)
        run: |
          set -euo pipefail
          git clone --recursive --depth 1 https://github.com/roothide/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          echo "$HOME/theos/toolchain/linux/iphone/bin" >> "$GITHUB_PATH"

      - name: Install iOS 16.5 SDK
        run: |
          set -euo pipefail
          mkdir -p "$HOME/theos/sdks"
          curl -fsSL -o "$HOME/theos/sdks/iPhoneOS16.5.sdk.tar.xz" "https://github.com/theos/sdks/releases/download/master/iPhoneOS16.5.sdk.tar.xz"
          tar -xf "$HOME/theos/sdks/iPhoneOS16.5.sdk.tar.xz" -C "$HOME/theos/sdks"

      - name: Fix maintainer script permissions
        run: |
          set -euo pipefail
          find . -name '*.sh' -o -name 'postinst' -o -name 'prerm' | xargs -I{} chmod +x {} 2>/dev/null || true

      - name: Build roothide package
        run: |
          set -euo pipefail
          export THEOS="$HOME/theos"
          export PATH="$THEOS/toolchain/linux/iphone/bin:$PATH"
          make clean || true
          make package FINALPACKAGE=1 ARCHS=arm64e 2>&1 | tee build-log.txt
          ls -l packages/

      - name: Diagnostics
        if: always()
        run: |
          tail -40 build-log.txt || true

      - name: Publish deb and build log
        continue-on-error: true
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B main
          git add build-log.txt out/latest.deb 2>/dev/null || git add build-log.txt || true
          git commit -m "ci: build log and deb [skip ci]" || true
          git pull --rebase origin main || true
          git push -u origin main || true

      - name: Upload deb artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AppDrawer-roothide
          path: packages/*.deb
          if-no-files-found: error

      - name: Read package version
        if: success()
        run: |
          set -euo pipefail
          VERSION="$(grep -m1 '^Version:' control | awk '{print $2}')"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "package version = ${VERSION}"

      - name: Release deb
        if: success()
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: AppDrawer ${{ env.VERSION }} roothide build ${{ github.run_number }}
          body: |
            **1.4.8** — 只改一个常量：竖屏面板顶部偏移 `kADPanelTopOffset` 由 40 提到 120，面板整体下移约 80pt（顶边约 107pt → 约 187pt）。除该常量外，`Core/`、`Shared/` 全部为 1.4.1 原样，未做任何精简。

            **高度**：`kADPanelMinHeight = 200`（1.4.1 基线，竖屏单行、横屏同为 200）。

            **宽度**：竖屏取满宽、左右各 8pt 边距并居中；横屏同样满宽，再由 `kADPanelMaxWidth = 430` 封顶居中。

            **键盘避让**：不加任何方向判断，唯一约束是「面板底边不得越过键盘顶边」：`originY = min(topLimit + 120, maxBottom - 200)`，超出时自动夹回，不会压到键盘。

            **安装提示**：装包后请 respring 再唤出；同版本号覆盖安装不会让 SpringBoard 换掉内存里的旧 dylib。

            deb: `com.voring.appdrawer_${{ env.VERSION }}_iphoneos-arm64e.deb`
          files: packages/*.deb
          fail_on_unmatched_files: false
