name: Build AppDrawer

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # 一次性：应用 1.7.0 补丁（修图标线程崩溃 + URL scheme 改纯钩子）并回写源码。
      # 补丁文件一旦已应用就会在提交里自行删掉，之后重跑这一步直接跳过。
      - name: Apply 1.7.0 patch
        run: |
          set -euo pipefail
          if [ ! -f layout-1.7.0.patch ]; then
            echo "patch already applied, skip"
            exit 0
          fi
          git apply --unidiff-zero --verbose layout-1.7.0.patch
          git rm -r -q Handler layout/DEBIAN/postinst layout/DEBIAN/postrm
          git rm -q --ignore-unmatch layout-cleanup.patch layout-1.6.0.patch VERSION-NOTES.md || true
          rm -f layout-1.7.0.patch
          git rm -q --ignore-unmatch layout-1.7.0.patch 2>/dev/null || true
          echo '--- 校验 ---'
          grep -m1 '^Version:' control
          grep -c 'ADScreenScale' Core/ADAppInfo.m
          grep -n 'canOpenURL' Core/ADURLDispatchHooks.m | head -3
          test -d Handler && exit 1 || echo 'Handler 已移除'
          if grep -rn 'urlhandler\|ADSubmitOpenRequest\|ADConsumeOpenRequest' Core Shared; then
            echo 'dangling reference'; exit 1
          else
            echo '无残留引用'
          fi
          git config user.name "Voring"
          git config user.email "64722054+Voring@users.noreply.github.com"
          git add -A
          git commit -m "1.7.0：修复图标线程崩溃（UIScreen 主线程断言）+ URL scheme 改纯 SpringBoard 钩子，移除中转 App"
          git push origin HEAD:main

      - name: Install build dependencies
        run: brew install ldid xz make

      - name: Setup Theos (roothide)
        run: |
          set -euo pipefail
          git clone --recursive --depth 1 https://github.com/roothide/theos.git "$HOME/theos"

      - name: Install iOS 16.5 SDK
        run: |
          set -euo pipefail
          git clone --filter=blob:none --sparse --depth 1 https://github.com/theos/sdks.git /tmp/sdks
          cd /tmp/sdks
          git sparse-checkout set iPhoneOS16.5.sdk
          rm -rf "$HOME/theos/sdks"
          mv /tmp/sdks "$HOME/theos/sdks"
          ls "$HOME/theos/sdks"

      - name: Check layout
        run: |
          set -euo pipefail
          ls -la layout/DEBIAN || true
          find layout -name 'postinst' -o -name 'postrm' | while read f; do chmod 755 "$f"; done || true

      - name: Build roothide package
        run: |
          set -o pipefail
          export THEOS="$HOME/theos"
          make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide ARCHS=arm64e \
            TARGET=iphone:clang:16.5:16.0 2>&1 | tee /tmp/build.log
          exit "${PIPESTATUS[0]}"

      - name: Diagnostics
        if: always()
        run: |
          pwd
          echo '--- packages ---'
          ls -l packages 2>&1 || true

      - name: Publish deb and build log
        if: always()
        continue-on-error: true
        run: |
          mkdir -p out
          if ls packages/*.deb >/dev/null 2>&1; then
            cp packages/*.deb out/latest.deb
          fi
          {
            echo "=== BUILD LOG (last 300 lines) ==="
            tail -n 300 /tmp/build.log 2>/dev/null || echo "no log produced"
          } | sed 's/[[:cntrl:]]//g' > build-log.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B main
          git add build-log.txt out/latest.deb 2>/dev/null || git add build-log.txt || true
          git commit -m "ci: build log and deb [skip ci]" || true
          git pull --rebase origin main || true
          git push -u origin main || true

      - name: Upload deb artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AppDrawer-roothide
          path: packages/*.deb
          if-no-files-found: error

      - name: Read package version
        if: success()
        run: |
          set -euo pipefail
          VERSION="$(grep -m1 '^Version:' control | awk '{print $2}')"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "package version = ${VERSION}"

      - name: Release deb
        if: success()
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: AppDrawer ${{ env.VERSION }} roothide build ${{ github.run_number }}
          body: |
            **1.7.0** — 修掉安全模式，并把 URL scheme 换成纯钩子实现（对齐 Kayoko 二改 / ShellX）。

            1. **安全模式修复**：图标预加载后台队列里调 `[UIScreen mainScreen]` 会触发主线程断言并 `abort()`，导致 SpringBoard 连续崩 3 次进安全模式（日志 `iconpreload` 队列 → `_iconFromSpringBoardAPI` → `+[UIScreen mainScreen]`）。现改为主线程启动时缓存屏幕倍数，后台只读缓存。
            2. **URL scheme 纯钩子**：删除 `Handler/` 中转 App（`/Applications/AppDrawerURL.app`，75 KB）与 `uicache` 注册/注销脚本，scheme 不再注册给 LaunchServices；只保留 SpringBoard 内 9 个分发钩子 + 新增 `UIApplication canOpenURL:` 预检钩子。
            3. **清掉死代码**：`pending.url` 文件通道 + Darwin 通知（约 70 行）、目录里的中转 App 过滤、过期的补丁/说明文件。

            **未动**：面板高度 200、宽度 430 封顶、下移量公式、键盘唤出、场景选取、检索；依旧没有任何横竖屏判定。UI 沿用 1.6.0（控制区在上、从上往下、下滑关闭）。

            deb: `com.voring.appdrawer_${{ env.VERSION }}_iphoneos-arm64e.deb`
          files: packages/*.deb
          fail_on_unmatched_files: false
