name: Build AppDrawer

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # 一次性补丁 1.4.9：下移量按可用空白等比缩放。已打过则跳过。
      - name: Apply 1.4.9 layout patch
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, re, sys
          p = pathlib.Path('Core/ADPanelViewController.m')
          src = p.read_text()
          if 'freeSpace' in src:
              print('already patched, skip')
              sys.exit(0)
          old = "    CGFloat originY = MIN(topLimit + kADPanelTopOffset, maxBottom - cardHeight);\n    originY = MAX(topLimit, originY);"
          new = "    CGFloat freeSpace = MAX(maxBottom - topLimit - cardHeight, 0.0);\n    CGFloat topOffset = MIN(kADPanelTopOffset, freeSpace * 0.208);\n    CGFloat originY = MIN(topLimit + topOffset, maxBottom - cardHeight);\n    originY = MAX(topLimit, originY);"
          assert src.count(old) == 1, 'layout block not found exactly once'
          p.write_text(src.replace(old, new))
          print('patched 1.4.9')
          PY

      # 一次性补丁 1.4.10：下移量改按「整屏空白」计算，键盘不再把它顶上去。
      - name: Apply 1.4.10 layout patch
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, re, sys
          p = pathlib.Path('Core/ADPanelViewController.m')
          s = p.read_text()
          if 'IGNORE_KEYBOARD_FOR_OFFSET' in s:
              print('already patched, skip'); sys.exit(0)
          old = "    CGFloat freeSpace = MAX(maxBottom - topLimit - cardHeight, 0.0);"
          new = "    // 下移量只看整屏空白，不受键盘影响（键盘弹起时不把面板顶上去）；键盘仅用于下方兜底夹取。\n    // IGNORE_KEYBOARD_FOR_OFFSET\n    CGFloat fullBottom = height - kADPanelEdgeGap;\n    CGFloat freeSpace = MAX(fullBottom - topLimit - cardHeight, 0.0);"
          assert s.count(old) == 1, 'freeSpace line not found exactly once'
          p.write_text(s.replace(old, new))
          c = pathlib.Path('control'); c.write_text(re.sub(r'^Version: .*', 'Version: 1.4.10', c.read_text(), count=1, flags=re.M))
          m = pathlib.Path('Makefile'); m.write_text(re.sub(r'^export PACKAGE_VERSION := .*', 'export PACKAGE_VERSION := 1.4.10', m.read_text(), count=1, flags=re.M))
          print('patched 1.4.10')
          PY
          sed -n '330,345p' Core/ADPanelViewController.m
          grep -n '^Version:' control

      - name: Commit patch back
        continue-on-error: true
        run: |
          set -euo pipefail
          git config user.name "Voring"
          git config user.email "64722054+Voring@users.noreply.github.com"
          git add Core/ADPanelViewController.m control Makefile
          git commit -m "1.4.10：下移量忽略键盘，键盘弹起时竖屏面板不再被顶上去" || true
          git push origin HEAD:main || true

      - name: Install build dependencies
        run: brew install ldid xz make

      - name: Setup Theos (roothide)
        run: |
          set -euo pipefail
          git clone --recursive --depth 1 https://github.com/roothide/theos.git "$HOME/theos"

      - name: Install iOS 16.5 SDK
        run: |
          set -euo pipefail
          git clone --filter=blob:none --sparse --depth 1 https://github.com/theos/sdks.git /tmp/sdks
          cd /tmp/sdks
          git sparse-checkout set iPhoneOS16.5.sdk
          rm -rf "$HOME/theos/sdks"
          mv /tmp/sdks "$HOME/theos/sdks"
          ls "$HOME/theos/sdks"

      - name: Fix maintainer script permissions
        run: |
          chmod 755 layout/DEBIAN/postinst layout/DEBIAN/postrm
          ls -l layout/DEBIAN

      - name: Build roothide package
        run: |
          set -o pipefail
          export THEOS="$HOME/theos"
          make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide ARCHS=arm64e \
            TARGET=iphone:clang:16.5:16.0 2>&1 | tee /tmp/build.log
          exit "${PIPESTATUS[0]}"

      - name: Diagnostics
        if: always()
        run: |
          pwd
          echo '--- packages ---'
          ls -l packages 2>&1 || true

      - name: Publish deb and build log
        if: always()
        continue-on-error: true
        run: |
          mkdir -p out
          if ls packages/*.deb >/dev/null 2>&1; then
            cp packages/*.deb out/latest.deb
          fi
          {
            echo "=== BUILD LOG (last 300 lines) ==="
            tail -n 300 /tmp/build.log 2>/dev/null || echo "no log produced"
          } | sed 's/[[:cntrl:]]//g' > build-log.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B main
          git add build-log.txt out/latest.deb 2>/dev/null || git add build-log.txt || true
          git commit -m "ci: build log and deb [skip ci]" || true
          git pull --rebase origin main || true
          git push -u origin main || true

      - name: Upload deb artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AppDrawer-roothide
          path: packages/*.deb
          if-no-files-found: error

      - name: Read package version
        if: success()
        run: |
          set -euo pipefail
          VERSION="$(grep -m1 '^Version:' control | awk '{print $2}')"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "package version = ${VERSION}"

      - name: Release deb
        if: success()
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: AppDrawer ${{ env.VERSION }} roothide build ${{ github.run_number }}
          body: |
            **1.4.10** — 竖屏键盘弹起时面板不再被顶上去：下移量的计算改用「整屏空白」，不再受键盘顶边影响；键盘只在面板底边真要压到键盘时做兜底夹取。仍然不做任何方向判定。

            竖屏无键盘与键盘弹起：顶边均为 187（此前键盘弹起会被推到 97）。横屏无键盘仍为 45；横屏键盘弹起时因兜底夹取落在 33（1.4.9 是 13，面板会比之前低 20pt，更贴近键盘）。

            **高度**：`kADPanelMinHeight = 200` 未变。**宽度**、检索均未变。

            deb: `com.voring.appdrawer_${{ env.VERSION }}_iphoneos-arm64e.deb`
          files: packages/*.deb
          fail_on_unmatched_files: false
