name: Build AppDrawer

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # 一次性：应用 1.5.0 精简补丁（删除零引用的弯路代码）并回写源码。
      - name: Apply 1.5.0 cleanup patch
        run: |
          set -euo pipefail
          git apply --verbose layout-cleanup.patch
          if grep -rn 'isPanelVisible\|ADPrefPanelHeightPercent\|ADPrefBlurStyle\|ADPrefForceScreenCoreFloating\|isSearchFieldFirstResponder' Core Shared; then
            echo 'dangling reference found'; exit 1
          else
            echo 'no dangling refs'
          fi
          grep -m1 '^Version:' control
          git config user.name "Voring"
          git config user.email "64722054+Voring@users.noreply.github.com"
          git add Core Makefile control
          git commit -m "1.5.0：删除零引用的弯路代码（48 行）并更新版本" || true
          git push origin HEAD:main || true

      - name: Install build dependencies
        run: brew install ldid xz make

      - name: Setup Theos (roothide)
        run: |
          set -euo pipefail
          git clone --recursive --depth 1 https://github.com/roothide/theos.git "$HOME/theos"

      - name: Install iOS 16.5 SDK
        run: |
          set -euo pipefail
          git clone --filter=blob:none --sparse --depth 1 https://github.com/theos/sdks.git /tmp/sdks
          cd /tmp/sdks
          git sparse-checkout set iPhoneOS16.5.sdk
          rm -rf "$HOME/theos/sdks"
          mv /tmp/sdks "$HOME/theos/sdks"
          ls "$HOME/theos/sdks"

      - name: Fix maintainer script permissions
        run: |
          chmod 755 layout/DEBIAN/postinst layout/DEBIAN/postrm
          ls -l layout/DEBIAN

      - name: Build roothide package
        run: |
          set -o pipefail
          export THEOS="$HOME/theos"
          make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide ARCHS=arm64e \
            TARGET=iphone:clang:16.5:16.0 2>&1 | tee /tmp/build.log
          exit "${PIPESTATUS[0]}"

      - name: Diagnostics
        if: always()
        run: |
          pwd
          echo '--- packages ---'
          ls -l packages 2>&1 || true

      - name: Publish deb and build log
        if: always()
        continue-on-error: true
        run: |
          mkdir -p out
          if ls packages/*.deb >/dev/null 2>&1; then
            cp packages/*.deb out/latest.deb
          fi
          {
            echo "=== BUILD LOG (last 300 lines) ==="
            tail -n 300 /tmp/build.log 2>/dev/null || echo "no log produced"
          } | sed 's/[[:cntrl:]]//g' > build-log.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B main
          git add build-log.txt out/latest.deb 2>/dev/null || git add build-log.txt || true
          git commit -m "ci: build log and deb [skip ci]" || true
          git pull --rebase origin main || true
          git push -u origin main || true

      - name: Upload deb artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AppDrawer-roothide
          path: packages/*.deb
          if-no-files-found: error

      - name: Read package version
        if: success()
        run: |
          set -euo pipefail
          VERSION="$(grep -m1 '^Version:' control | awk '{print $2}')"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "package version = ${VERSION}"

      - name: Release deb
        if: success()
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: AppDrawer ${{ env.VERSION }} roothide build ${{ github.run_number }}
          body: |
            **1.5.0** — 只删掉测试期间被证实无用的弯路代码，不改任何行为：共 48 行。

            删除项（全部零引用，删前逐个确认无调用方）：`ADPrefPanelHeightPercent`（早期按屏高百分比的旧高度方案）、`ADPrefForceScreenCoreFloating`、`ADPrefBlurStyle`、`isSearchFieldFirstResponder`（早期键盘诊断残留）、`isPanelVisible`，以及为 CI 补丁幂等而留的标记注释。

            **未动**：布局公式、高度 200、宽度 430 封顶、检索、键盘唤出、场景选取。反汇编与 1.4.10 逐行比对仅相差这些函数的符号。

            **编译**：源码已本地全量编译验证（arm64e 链接由 CI 完成）。

            deb: `com.voring.appdrawer_${{ env.VERSION }}_iphoneos-arm64e.deb`
          files: packages/*.deb
          fail_on_unmatched_files: false
